[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teasender"
version = "0.1.0"
description = "Automated announcement posting to allowlisted Telegram chats via a personal account"
requires-python = ">=3.11"
dependencies = [
    "telethon==1.37.0",
    "aiogram==3.13.1",
    "SQLAlchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "APScheduler==3.10.4",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "cryptography==43.0.3",
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "aiosqlite==0.20.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
